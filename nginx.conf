server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx server version signature
    server_tokens off;

    # Protect against DoS and memory exhaustion via large payload injection
    client_max_body_size 10M;

    # Security Headers to protect against Clickjacking, MIME-sniffing, XSS, and enforce HTTPS
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression for performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Deny access to hidden files and directories (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive database dumps, backups, and server scripts
    location ~* \.(?:sql|bak|config|env|log|bat|vbs)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Resend Email API Proxy - Avoids CORS in browser
    location /api/resend/ {
        proxy_pass https://api.resend.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.resend.com;
        proxy_pass_request_headers on;
    }

    # Standard Robots and Sitemap
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable static assets safely
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
