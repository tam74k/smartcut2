<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SMART CUT PRO - نظام إدارة الصالونات السحابي</title>
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link id="app-apple-icon" rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      (function() {
        try {
          var logo = localStorage.getItem('smartcut_salon_logo_url');
          var salonName = localStorage.getItem('smartcut_salon_name');
          if (!logo || !salonName) {
            var raw = localStorage.getItem('smartcut_app_settings');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.logoUrl && !logo) logo = parsed.logoUrl;
              if (parsed && parsed.salonName && !salonName) salonName = parsed.salonName;
            }
          }
          if (logo) {
            var fav = document.getElementById('app-favicon');
            if (fav) fav.href = logo;
            var appleFav = document.getElementById('app-apple-icon');
            if (appleFav) appleFav.href = logo;
          }
          if (salonName) {
            document.title = salonName + ' - نظام إدارة الصالونات السحابي';
          }
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
